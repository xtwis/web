name: sync-docs

on:
  repository_dispatch:
    types:
      - docs-sync

concurrency:
  group: sync-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/deploy
        with:
          hook-url: ${{ secrets.VERCEL_DEPLOY_HOOK }}
